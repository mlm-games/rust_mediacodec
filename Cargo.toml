[package]
name = "anodecs"
version = "0.1.7"
edition = "2024"
resolver = "3"
rust-version = "1.92"
readme = "README.md"
authors = ["Adebayo Jagunmolu <hardebahyho@gmail.com>", "mlm-games"]
description = "Rust bindings to MediaCodec, with an easy-to-use API (formerly mediacodec)"
repository = "https://github.com/mlm-games/rust_mediacodec"
license = "MIT"
keywords = ["ffi", "bindings", "multimedia", "codec", "android"]
categories = [
    "api-bindings",
    "encoding",
    "multimedia",
    "multimedia::audio",
    "multimedia::video",
]
homepage = "https://github.com/mlm-games/rust_mediacodec"

[lib]
name = "anodecs"
crate-type = ["cdylib", "rlib"]

[[example]]
name = "demuxing"
crate-type = ["cdylib"]

[[example]]
name = "decoding"
crate-type = ["cdylib"]

[target.'cfg(target_os = "android")'.dependencies]
log = "0.4"
android_logger = "0.15"
jni = "0.22"
ndk-context = "0.1"

[features]
api24 = []
api26 = ["api24"]
api28 = ["api26"]
api29 = ["api28"]

[package.metadata.docs.rs]
features = ["api28"]
targets = [
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "i686-linux-android",
    "x86_64-linux-android",
]
